project:
  type: book
  resources:
    - CNAME              # custom-domain marker for GitHub Pages (agdataanalytics.com)
    - images/*
    # never copy one profile's output into the other's (recursive nesting)
    - "!_book/"
    - "!_book-full/"
    - textbook_examples/*
    - practice/data/*
    - practice/data/module03/*   # per-question files for the Module 3 bank
    - practice/answers/*
    - examples/**
    - practice/quiz/*
    - practice/quiz2/*
    - practice/field_viewer/*
    - downloads/*

profile:
  default: public

book:
  title: "Agricultural Data Analytics"
  subtitle: "Foundations and Inference"
  author: "Peter Slade"
  date: today
  site-url: https://agdataanalytics.com
  # chapters are defined per render profile:
  #   _quarto-public.yml (default) = student subset; _quarto-full.yml = complete draft
  appendices:
    - data_appendix.qmd
  sidebar:
    style: "docked"
    search: true
    # Collapse module sections by default so the sidebar shows the ten module
    # names rather than every chapter at once. The current module expands
    # automatically as you read it.
    collapse-level: 1
  navbar:
    right:
      # Anonymous feedback form (Microsoft Forms). Replace the href below with
      # the real "Anyone can respond" link from forms.office.com.
      - text: "Course Tutor"
        icon: mortarboard
        href: https://chatgpt.com/g/g-68b8648941f08191a348a684896e3107-arec-261-tutor
      - text: "Syllabus"
        icon: file-earmark-text
        href: syllabus.qmd
      - text: "Feedback"
        icon: chat-left-text
        href: feedback.qmd

bibliography: references.bib

format:
  html:
    theme: [cosmo, theme.scss]
    # Keep real tab characters in code blocks. The test-bank data blocks are
    # tab-separated so a copy-paste into Excel splits into columns; without
    # this Pandoc expands the tabs to spaces and Excel gets one column.
    preserve-tabs: true
    toc: true
    toc-depth: 4
    number-sections: true
    code-fold: false
    # Click any figure to open it full size. Matters most for the wide images —
    # Minard's map and the Excel screenshots — which are unreadable at text width.
    lightbox: auto
    # Wraps executed-chunk console output in a collapsed <details> (see
    # console-fold.html); styling lives in theme.scss under .console-fold.
    include-after-body: console-fold.html

execute:
  eval: false

# When a chunk *is* executed (with #| eval: true), keep the code and its
# console output as two separate blocks: a clean, copy-pasteable code block,
# followed by a labelled "Console output" band showing what R printed back.
# (comment: "" drops the "##" knitr would otherwise prefix output lines with.)
knitr:
  opts_chunk:
    collapse: false
    prompt: false
    comment: ""
    # Hold all results to the end of the chunk. Without this, knitr splits a
    # multi-statement chunk into one code block + one output block *per
    # printing statement*, so a six-line chunk became six code/output pairs.
    results: hold
