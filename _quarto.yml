project:
  type: book
  resources:
    - CNAME              # custom-domain marker for GitHub Pages (agdataanalytics.com)
    - images/*
    - textbook_examples/*
    - practice/data/*
    - practice/quiz/*
    - practice/quiz2/*

book:
  title: "Agricultural Data Analytics"
  subtitle: "Foundations and Inference"
  author: "Peter Slade"
  date: today
  site-url: https://agdataanalytics.com
  chapters:
    - index.qmd
    - intro.qmd
    # Each module is a part containing one or more chapters. Quarto numbers
    # chapters sequentially across the whole book, so the module number lives
    # in the part heading rather than the chapter number.
    - part: "Module 1: Describing Data in Excel"
      chapters:
        - module01a.qmd
        - module01b.qmd
        - module01c.qmd
    - part: "Module 2: Introduction to R"
      chapters:
        - module02a.qmd
        - module02b.qmd
        - module02c.qmd
    - part: "Module 3: Communication and Graphing"
      chapters:
        - module03a.qmd
        - module03b.qmd
        - module03c.qmd
        - module03d.qmd
    - part: "Module 4: Relationships Between Variables"
      chapters:
        - module06.qmd
    - part: "Module 5: Probability and Random Variables"
      chapters:
        - module07.qmd
    - part: "Module 6: Probability and Simulation I"
      chapters:
        - module08.qmd
    - part: "Module 7: Probability and Simulation II"
      chapters:
        - module09.qmd
    - part: "Module 8: Sampling"
      chapters:
        - module10.qmd
    - part: "Module 9: Randomization Tests"
      chapters:
        - module11.qmd
    - part: "Module 10: Bootstrap Methods"
      chapters:
        - module12.qmd
    - "---"
    - part: "Test Bank"
      chapters:
        - practice/module01_bank.qmd
        - practice/module01_practice.qmd
        - practice/module02_practice.qmd
    - references.qmd
    - feedback.qmd        # rendered as a book page; hidden from the sidebar via theme.scss, reached from the navbar
  sidebar:
    style: "docked"
    search: true
  navbar:
    right:
      # Anonymous feedback form (Microsoft Forms). Replace the href below with
      # the real "Anyone can respond" link from forms.office.com.
      - text: "Feedback"
        icon: chat-left-text
        href: feedback.qmd

bibliography: references.bib

format:
  html:
    theme: [cosmo, theme.scss]
    toc: true
    toc-depth: 4
    number-sections: true
    code-fold: false
    # Wraps executed-chunk console output in a collapsed <details> (see
    # console-fold.html); styling lives in theme.scss under .console-fold.
    include-after-body: console-fold.html

execute:
  eval: false

# When a chunk *is* executed (with #| eval: true), keep the code and its
# console output as two separate blocks: a clean, copy-pasteable code block,
# followed by a labelled "Console output" band showing what R printed back.
# (comment: "" drops the "##" knitr would otherwise prefix output lines with.)
knitr:
  opts_chunk:
    collapse: false
    prompt: false
    comment: ""
    # Hold all results to the end of the chunk. Without this, knitr splits a
    # multi-statement chunk into one code block + one output block *per
    # printing statement*, so a six-line chunk became six code/output pairs.
    results: hold
