project:
  type: book
  resources:
    - CNAME              # custom-domain marker for GitHub Pages (agdataanalytics.com)
    - images/*
    - textbook_examples/*
    - practice/data/*
    - practice/quiz/*
    - practice/quiz2/*

book:
  title: "Agricultural Data Analytics"
  subtitle: "Foundations and Inference"
  author: "Peter Slade"
  date: today
  site-url: https://agdataanalytics.com
  chapters:
    - index.qmd
    - intro.qmd
    - part: "Part 1: Data Foundations"
      chapters:
        - module01.qmd
        - module02.qmd
        - module03.qmd
        - module04.qmd
        - module05.qmd
        - module06.qmd
    - part: "Part 2: Probability and Simulation"
      chapters:
        - module07.qmd
        - module08.qmd
        - module09.qmd
    - part: "Part 3: Inference Through Simulation"
      chapters:
        - module10.qmd
        - module11.qmd
        - module12.qmd
    - "---"
    - part: "Test Bank"
      chapters:
        - practice/module01_bank.qmd
        - practice/module01_practice.qmd
        - practice/module02_practice.qmd
    - references.qmd
    - feedback.qmd        # rendered as a book page; hidden from the sidebar via theme.scss, reached from the navbar
  sidebar:
    style: "docked"
    search: true
  navbar:
    right:
      # Anonymous feedback form (Microsoft Forms). Replace the href below with
      # the real "Anyone can respond" link from forms.office.com.
      - text: "Feedback"
        icon: chat-left-text
        href: feedback.qmd

bibliography: references.bib

format:
  html:
    theme: [cosmo, theme.scss]
    toc: true
    toc-depth: 3
    number-sections: true
    code-fold: false

execute:
  eval: false
