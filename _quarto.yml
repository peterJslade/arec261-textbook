project:
  type: book
  resources:
    - CNAME              # custom-domain marker for GitHub Pages (agdataanalytics.com)
    - images/*
    - textbook_examples/*
    - practice/data/*
    - practice/answers/*
    - examples/**
    - practice/quiz/*
    - practice/quiz2/*

book:
  title: "Agricultural Data Analytics"
  subtitle: "Foundations and Inference"
  author: "Peter Slade"
  date: today
  site-url: https://agdataanalytics.com
  chapters:
    - index.qmd
    - intro.qmd
    # Each module is a part containing one or more chapters. Quarto numbers
    # chapters sequentially across the whole book, so the module number lives
    # in the part heading rather than the chapter number.
    - part: "Module 1: Introduction to Excel"
      chapters:
        - module01a.qmd
        - module01b.qmd
        - module01c.qmd
    - part: "Module 2: Introduction to R"
      chapters:
        - module02a.qmd
        - module02b.qmd
        - module02c.qmd
    - part: "Module 3: Getting and Combining Data"
      chapters:
        - module03a.qmd
        - module03b.qmd
        - module03c.qmd
    - part: "Module 4: Graphing"
      chapters:
        - module04a.qmd
        - module04b.qmd
        - module04c.qmd
    - part: "Module 5: Using Artificial Intelligence"
      chapters:
        - module05a.qmd
        - module05b.qmd
        - module05c.qmd
    - part: "Module 6: Communicating Results"
      chapters:
        - module06a.qmd
        - module06b.qmd
        - module06c.qmd
    - part: "Module 7: Relationships Between Variables"
      chapters:
        - module07a.qmd
        - module07b.qmd
        - module07c.qmd
    - part: "Module 8: Probability and Random Variables"
      chapters:
        - module08.qmd
    - part: "Module 9: Probability and Simulation I"
      chapters:
        - module09.qmd
    - part: "Module 10: Probability and Simulation II"
      chapters:
        - module10.qmd
    - part: "Module 11: Sampling"
      chapters:
        - module11.qmd
    - part: "Module 12: Randomization Tests"
      chapters:
        - module12.qmd
    - part: "Module 13: Bootstrap Methods"
      chapters:
        - module13.qmd
    - "---"
    - part: "Test Bank"
      chapters:
        - practice/module01_bank.qmd
        # module01_practice.qmd -- the superseded 8-question design, kept in
        # the repo but unpublished so students see one Module 1 bank
        # module02_practice.qmd -- predates the Module 2 restructure (canola
        # trial data, no tidy data/pivoting in Module 2); superseded by
        # module02_bank.qmd
        - practice/module02_bank.qmd
    - references.qmd
    - feedback.qmd        # rendered as a book page; hidden from the sidebar via theme.scss, reached from the navbar
  appendices:
    - data_appendix.qmd
  sidebar:
    style: "docked"
    search: true
    # Collapse module sections by default so the sidebar shows the ten module
    # names rather than every chapter at once. The current module expands
    # automatically as you read it.
    collapse-level: 1
  navbar:
    right:
      # Anonymous feedback form (Microsoft Forms). Replace the href below with
      # the real "Anyone can respond" link from forms.office.com.
      - text: "Feedback"
        icon: chat-left-text
        href: feedback.qmd

bibliography: references.bib

format:
  html:
    theme: [cosmo, theme.scss]
    toc: true
    toc-depth: 4
    number-sections: true
    code-fold: false
    # Click any figure to open it full size. Matters most for the wide images —
    # Minard's map and the Excel screenshots — which are unreadable at text width.
    lightbox: auto
    # Wraps executed-chunk console output in a collapsed <details> (see
    # console-fold.html); styling lives in theme.scss under .console-fold.
    include-after-body: console-fold.html

execute:
  eval: false

# When a chunk *is* executed (with #| eval: true), keep the code and its
# console output as two separate blocks: a clean, copy-pasteable code block,
# followed by a labelled "Console output" band showing what R printed back.
# (comment: "" drops the "##" knitr would otherwise prefix output lines with.)
knitr:
  opts_chunk:
    collapse: false
    prompt: false
    comment: ""
    # Hold all results to the end of the chunk. Without this, knitr splits a
    # multi-statement chunk into one code block + one output block *per
    # printing statement*, so a six-line chunk became six code/output pairs.
    results: hold
