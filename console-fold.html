<script>
// Wrap each executed chunk's console output in a collapsed <details> so
// students can predict what R will print before revealing it.
//
// Quarto has code-fold for *code*, but no equivalent for output, so we do it
// here: for every .cell-output block, build a <details class="console-fold">
// and move the output inside it. Runs once on DOMContentLoaded.
document.addEventListener("DOMContentLoaded", function () {
  document.querySelectorAll(".console-transcript, .cell-output").forEach(function (out) {
    // Don't double-wrap, and skip output already inside a transcript.
    if (out.closest("details.console-fold")) return;
    if (out.classList.contains("cell-output") && out.closest(".console-transcript")) return;

    var details = document.createElement("details");
    details.className = "console-fold";

    var summary = document.createElement("summary");
    // transcript = a full console session from console(); stderr =
    // messages/warnings; error = a deliberate mistake we're showing.
    if (out.classList.contains("console-transcript")) {
      summary.textContent = "Show console session";
    } else if (out.classList.contains("cell-output-error")) {
      summary.textContent = "Show R's error message";
    } else if (out.classList.contains("cell-output-stderr")) {
      summary.textContent = "Show console message";
    } else {
      summary.textContent = "Show console output";
    }
    details.appendChild(summary);

    out.parentNode.insertBefore(details, out);
    details.appendChild(out);
  });
});
</script>
