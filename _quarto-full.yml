# Activated with --profile full: renders the complete draft book
# into _book-full/ (kept separate from the public _book/ output).
project:
  output-dir: _book-full

book:
  chapters:
    - index.qmd
    # Each module is a part containing one or more chapters. Quarto numbers
    # chapters sequentially across the whole book, so the module number lives
    # in the part heading rather than the chapter number.
    - part: "Module 1: Introduction to Excel"
      chapters:
        - module01a.qmd
        - module01b.qmd
        - module01c.qmd
    - part: "Module 2: Introduction to R"
      chapters:
        - module02a.qmd
        - module02b.qmd
        - module02c.qmd
    - part: "Module 3: Getting and Combining Data"
      chapters:
        - module03a.qmd
        - module03b.qmd
        - module03c.qmd
    - part: "Module 4: Graphing"
      chapters:
        - module04a.qmd
        - module04b.qmd
        - module04c.qmd
    - part: "Module 5: Using Artificial Intelligence"
      chapters:
        - module05a.qmd
        - module05b.qmd
        - module05c.qmd
        - module05d.qmd
    - part: "Module 6: Spatial Data and Mapping"
      chapters:
        - module06a.qmd
        - module06b.qmd
        - module06c.qmd
    - part: "Module 7: Field-Level Data"
      chapters:
        - module07a.qmd
        - module07b.qmd
        - module07c.qmd
    - part: "Module 8: External Spatial Data"
      chapters:
        - module08a.qmd
        - module08b.qmd
        - module08c.qmd
    - part: "Module 9: Thinking About Modelling Data"
      chapters:
        - module09a.qmd
        - module09b.qmd
        - module09c.qmd
    - part: "Module 10: Correlation and Simple Linear Models"
      chapters:
        - module10a.qmd
        - module10b.qmd
        - module10c.qmd
    - part: "Module 11: Advanced Visualization and Interactive Displays"
      chapters:
        - module11a.qmd
        - module11b.qmd
        - module11c.qmd
    - part: "Module 12: Communicating and Delivering Results"
      chapters:
        - module12_assignment.qmd
        - module12a.qmd
        - module12b.qmd
        - module12c.qmd
    - "---"
    - part: "Test Bank"
      chapters:
        - practice/module01_bank.qmd
        # module01_practice.qmd -- the superseded 8-question design, kept in
        # the repo but unpublished so students see one Module 1 bank
        # module02_practice.qmd -- predates the Module 2 restructure (canola
        # trial data, no tidy data/pivoting in Module 2); superseded by
        # module02_bank.qmd
        - practice/module02_bank.qmd
        - practice/module03_bank.qmd
        - practice/module04_bank.qmd
    - references.qmd
    - feedback.qmd        # rendered as a book page; hidden from the sidebar via theme.scss, reached from the navbar
    - syllabus.qmd        # same pattern: navbar-only page at /syllabus.html
