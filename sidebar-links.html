<!-- Quick links pinned above the sidebar table of contents. The hrefs are
     resolved against the sidebar title's own index link, so they work at any
     page depth and in local file:// renders. -->
<script>
document.addEventListener("DOMContentLoaded", function () {
  var sidebar = document.getElementById("quarto-sidebar");
  if (!sidebar || sidebar.querySelector(".sidebar-quick-links")) return;
  var menu = sidebar.querySelector(".sidebar-menu-container");
  if (!menu) return;
  var titleLink = sidebar.querySelector('.sidebar-title a') ||
                  sidebar.querySelector('a[href$="index.html"]');
  var base = titleLink ? titleLink.href : window.location.href;
  var links = [
    ["AI tutor", "https://chatgpt.com/g/g-68b8648941f08191a348a684896e3107-arec-261-tutor", "bi-mortarboard", true],
    ["Syllabus", new URL("syllabus.html", base).href, "bi-file-earmark-text", false],
    ["Feedback", new URL("feedback.html", base).href, "bi-chat-left-text", false]
  ];
  var div = document.createElement("div");
  div.className = "sidebar-quick-links";
  links.forEach(function (l) {
    var a = document.createElement("a");
    a.href = l[1];
    if (l[3]) { a.target = "_blank"; a.rel = "noopener"; }
    a.innerHTML = '<i class="bi ' + l[2] + '"></i> ' + l[0];
    div.appendChild(a);
  });
  menu.parentNode.insertBefore(div, menu);
});
</script>
